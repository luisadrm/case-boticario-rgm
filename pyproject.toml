[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "case-rgm"
version = "1.0.0"
description = "Pipeline de previsão de demanda do case RGM: limpeza, features, LightGBM com faixa calibrada e semáforo de confiança"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "lightgbm>=4.3",
]

[project.optional-dependencies]
picos = ["prophet>=1.1"]

[project.scripts]
case-rgm = "case_rgm.pipeline:main"

[tool.setuptools.packages.find]
where = ["src"]
