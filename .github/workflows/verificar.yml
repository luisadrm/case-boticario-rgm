# GitHub Actions: mesma verificação do .gitlab-ci.yml (job "verificar").
# Confere se o notebook (.ipynb) e a versão em texto (.py) estão sincronizados
# e se o código compila. Roda a cada push e pull request na main.
name: verificar

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Instalar jupytext
        run: pip install --quiet jupytext==1.19.6

      - name: Notebook e .py sincronizados
        run: |
          jupytext --to py:percent -o /tmp/case_rgm_v2.py notebooks/case_rgm_v2.ipynb
          diff -q /tmp/case_rgm_v2.py notebooks/case_rgm_v2.py || (echo "Notebook e .py fora de sincronia. Rode 'jupytext --sync notebooks/case_rgm_v2.ipynb'" && exit 1)

      - name: Código compila
        run: python -m py_compile notebooks/case_rgm_v2.py
