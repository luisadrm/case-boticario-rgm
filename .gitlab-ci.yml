# Pipeline simples:
#  1. "verificar": confere se os notebooks pareados (.ipynb ↔ .py) estão sincronizados e se o código compila.
#  2. "executar_notebook": roda o notebook v2 de ponta a ponta (manual: leva ~10 min e precisa da base,
#     fornecida pela variável de CI do tipo arquivo DADOS_VENDAS).

stages:
  - verificar
  - executar

default:
  image: python:3.13-slim

verificar:
  stage: verificar
  script:
    - pip install --quiet jupytext==1.19.6
    # regenera o .py a partir do .ipynb e exige que seja idêntico ao versionado
    - jupytext --to py:percent -o /tmp/case_rgm_v2.py notebooks/case_rgm_v2.ipynb
    - diff -q /tmp/case_rgm_v2.py notebooks/case_rgm_v2.py || (echo "Notebook e .py fora de sincronia. Rode 'jupytext --sync notebooks/case_rgm_v2.ipynb'" && exit 1)
    - python -m py_compile notebooks/case_rgm_v2.py

executar_notebook:
  stage: executar
  when: manual
  timeout: 45m
  script:
    - test -n "$DADOS_VENDAS" || (echo "Defina a variável de CI DADOS_VENDAS (tipo arquivo) com a base do case" && exit 1)
    - cp "$DADOS_VENDAS" data/raw/vendas_sku_semanal.csv
    - pip install --quiet -r requirements.txt
    - cd notebooks && jupyter nbconvert --to notebook --execute case_rgm_v2.ipynb --output case_rgm_v2_executado.ipynb --ExecutePreprocessor.timeout=2400
  artifacts:
    paths:
      - notebooks/case_rgm_v2_executado.ipynb
      - outputs/
    expire_in: 2 weeks
